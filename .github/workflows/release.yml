# Release: build every target from a version tag, package reproducibly, attach SHA256SUMS, attest
# every archive (Sigstore-signed SLSA build provenance), and create a DRAFT GitHub release. Nothing is
# published until a maintainer reviews the draft and presses Publish.
# A push to a `ci/**` branch (or `workflow_dispatch`) is a dry run: it builds and packages every target
# and keeps the archives as workflow artifacts for one day; it attests nothing and drafts nothing.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
          if [ "${{ matrix.musl }}" = "true" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools; fi
      - name: "Build (reproducible: locked, pinned toolchain, no local paths in the binary)"
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          home="${USERPROFILE:-$HOME}" # the native form on Windows, where rustc sees native paths
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$home/.cargo=/cargo --remap-path-prefix=$home/.rustup=/rustup"
          # Windows: link the C runtime statically, so the binary needs only system DLLs (SPEC §10).
          case "${{ matrix.target }}" in *-windows-msvc) RUSTFLAGS="$RUSTFLAGS -C target-feature=+crt-static" ;; esac
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Dependency policy (libSystem only on macOS, fully static on Linux)
        if: runner.os != 'Windows'
        run: scripts/check-binary-deps.sh target/${{ matrix.target }}/release/agentdiet
      - name: Windows binary runs
        if: runner.os == 'Windows'
        run: target/${{ matrix.target }}/release/agentdiet.exe --version
      - name: Package
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          exe=target/${{ matrix.target }}/release/agentdiet
          [ -f "$exe.exe" ] && exe="$exe.exe"
          py=python3; command -v python3 > /dev/null 2>&1 || py=python # Windows runners: `python`
          "$py" scripts/package.py binary ${{ matrix.target }} "$exe" dist
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "$py" scripts/package.py completions target/${{ matrix.target }}/release/agentdiet dist
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 7 || 1 }}

  draft-release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # a Sigstore signing certificate for the attestations
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && cat ./*.sha256 | sort -k 2 > SHA256SUMS && rm -f ./*.sha256 && cat SHA256SUMS
      - name: Attest every archive (verify with `gh attestation verify <archive> --repo <owner>/agentdiet`)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the draft (never published by CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## \[/{n++} n==1' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "AgentDiet $GITHUB_REF_NAME" --notes "$notes"
