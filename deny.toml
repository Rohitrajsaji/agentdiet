# cargo deny: known vulnerabilities, licences, sources and duplicate crates (CI job `deny`).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Every licence in the tree today (checked 2026-10-20). Adding one is a deliberate change.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]

[bans]
# foldhash, hashbrown and syn each come in two versions through upstream crates; warn, do not fail.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
