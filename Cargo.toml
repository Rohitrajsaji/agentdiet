[package]
name = "agentdiet"
version = "0.1.0"
edition = "2024"
description = "Context firewall for AI coding agents"
license = "MIT"
readme = "README.md"

[lib]
name = "agentdiet"
path = "src/lib.rs"

[[bin]]
name = "agentdiet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# dirs: cross-platform home/config dir resolution (called only from main.rs); pure Rust.
dirs = "6"
# inquire 0.9: same crossterm (0.29) as ratatui's backend, so the binary carries one crossterm, not two.
inquire = "0.9"
# ratatui: the `agentdiet top` TUI (mandated by CLAUDE.md). Defaults off: no calendar widget (`time`),
# macros or layout cache (`lru`); only the crossterm backend. Pure Rust.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# crossterm: ratatui's terminal backend; `top` uses it directly for key events and raw mode. Must stay
# the version ratatui-crossterm resolves (0.29) so only one copy is linked. libc/rustix only.
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
# preserve_order: re-serialised user configs keep their key order. raw_value: toon.rs keeps each JSON
# number's original text via `RawValue`; unlike `arbitrary_precision` it adds a type and changes nothing
# about `Value`/`Number`, so state.json and the assistant configs parse and serialise exactly as before.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# regex: secret-scrubber patterns; regex::bytes keeps non-UTF-8 output lossless. Pure Rust, linear time.
regex = "1"
# rusqlite: bundled SQLite for memory.db (mandated by CLAUDE.md); no system SQLite. `bundled` alone
# compiles in FTS5 and its built-in bm25(); `bundled-full` would add chrono -> iana-time-zone ->
# CoreFoundation on macOS plus ~30 crates we do not use.
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
# toml: parse-only (no `display`/writer); Codex config.toml edits are validated against a real TOML
# parser before being written, while the edit itself stays a byte edit that keeps comments.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"

# libc: O_NOFOLLOW / O_NONBLOCK for hardened regular-file opens (std exposes `custom_flags` but not
# the constants). Already in the dependency tree (sha2, dirs, inquire all pull it in), so it adds no
# crate and no runtime requirement; the libc crate is what std itself links against.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# tempfile: isolated TempDir homes/projects for tests only.
tempfile = "3"
# proptest: property tests for the prompt-directive parser, the scanner's literal filter and the
# EXPERIENCE.md renderer. Tests only; never linked into the binary.
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
